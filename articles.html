<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Articles</title>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

<style>
body{background:#0f172a;color:white;font-family:sans-serif;}
.container{padding:20px;}
textarea{width:100%;height:80px;}
.article{background:#1e293b;padding:10px;margin:10px 0;border-radius:8px;}
img{max-width:100%;}
</style>
</head>

<body>

<div class="container">

<button onclick="location='employee.html'">Back</button>

<h2>Articles</h2>

<textarea id="text"></textarea>
<input type="file" id="img">
<button onclick="post()">Post</button>

<input id="search" placeholder="Search...">

<div id="results"></div>

</div>

<script>

const firebaseConfig={
apiKey:"AIzaSyD6c1k8BURliiSAwEOnT_HW1MaZjNhHJSM",
authDomain:"iron-companies.firebaseapp.com",
projectId:"iron-companies",
storageBucket:"iron-companies.firebasestorage.app",
messagingSenderId:"692492696732",
appId:"1:692492696732:web:cd29fc124ddc0fa014c159"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();
const storage=firebase.storage();
const auth=firebase.auth();

let user;

auth.onAuthStateChanged(u=>user=u);

async function post(){
const t=text.value;
const f=img.files[0];

let url=null;

if(f){
const ref=storage.ref("articles/"+Date.now());
await ref.put(f);
url=await ref.getDownloadURL();
}

await db.collection("articles").add({
text:t,
image:url,
uid:user.uid,
time:Date.now()
});

text.value="";
img.value="";
}

search.oninput=async ()=>{
results.innerHTML="";
const q=search.value.toLowerCase();
if(!q) return;

const snap=await db.collection("articles").get();

snap.forEach(doc=>{
const a=doc.data();
if(a.text && a.text.toLowerCase().includes(q)){

results.innerHTML+=`
<div class="article">
${a.text}
${a.image?`<br><img src="${a.image}">`:""}
<br>
<small>${new Date(a.time).toLocaleString()}</small>
${a.uid===user.uid?`<br><button onclick="del('${doc.id}')">Delete</button>`:""}
</div>
`;

}
});
};

async function del(id){
await db.collection("articles").doc(id).delete();
search.dispatchEvent(new Event("input"));
}

</script>

</body>
</html>
