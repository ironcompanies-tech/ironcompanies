<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Profile</title>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<style>
body{
font-family:sans-serif;
background:#0f172a;
color:white;
padding:20px;
}

input{
width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:none;
}

button{
padding:10px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
cursor:pointer;
}

img{
width:100px;
height:100px;
border-radius:50%;
margin-bottom:10px;
}
</style>
</head>

<body>

<h2>My Profile</h2>

<img id="preview">

<input id="name" placeholder="Name">
<input id="job" placeholder="Occupation">

<input type="file" id="imgInput" accept="image/*">

<button onclick="save()">Update Profile</button>
<button onclick="location='employee.html'">Back</button>

<script>
const firebaseConfig={
apiKey:"AIzaSyD6c1k8BURliiSAwEOnT_HW1MaZjNhHJSM",
authDomain:"iron-companies.firebaseapp.com",
projectId:"iron-companies",
storageBucket:"iron-companies.firebasestorage.app",
messagingSenderId:"692492696732",
appId:"1:692492696732:web:cd29fc124ddc0fa014c159"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();
const auth=firebase.auth();

let user;

auth.onAuthStateChanged(async u=>{
if(!u){ location="signup.html"; return; }

user=u;

const doc=await db.collection("users").doc(user.uid).get();

if(doc.exists){
const d=doc.data();
name.value=d.username||"";
job.value=d.occupation||"";
preview.src=d.profilePic||"";
}
});

// compress image
function compress(file){
return new Promise(res=>{
const r=new FileReader();
r.readAsDataURL(file);

r.onload=e=>{
const img=new Image();
img.src=e.target.result;

img.onload=()=>{
const c=document.createElement("canvas");
const max=300;
const scale=max/img.width;

c.width=max;
c.height=img.height*scale;

const ctx=c.getContext("2d");
ctx.drawImage(img,0,0,c.width,c.height);

res(c.toDataURL("image/jpeg",0.6));
};
};
});
}

async function save(){
let imgData=null;
const file=imgInput.files[0];

if(file){
imgData=await compress(file);
}

await db.collection("users").doc(user.uid).set({
username:name.value,
occupation:job.value,
profilePic:imgData || preview.src || ""
},{merge:true});

alert("Profile Updated");
}
</script>

</body>
</html>
