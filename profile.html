<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Profile</title>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

<style>
body{background:#0f172a;color:white;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;}
.card{background:#1e293b;padding:20px;border-radius:10px;text-align:center;width:300px;}
img{width:100px;height:100px;border-radius:50%;}
input{width:100%;padding:8px;margin-top:8px;}
button{margin-top:10px;padding:10px;width:100%;}
</style>
</head>

<body>

<div class="card">

<img id="pic">

<h2 id="name"></h2>
<p id="job"></p>

<input id="newName">
<input id="newJob">
<input type="file" id="newPic">

<button onclick="update()">Update</button>
<button onclick="location='employee.html'">Back</button>

</div>

<script>

const firebaseConfig={
apiKey:"AIzaSyD6c1k8BURliiSAwEOnT_HW1MaZjNhHJSM",
authDomain:"iron-companies.firebaseapp.com",
projectId:"iron-companies",
storageBucket:"iron-companies.firebasestorage.app",
messagingSenderId:"692492696732",
appId:"1:692492696732:web:cd29fc124ddc0fa014c159"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();
const storage=firebase.storage();
const auth=firebase.auth();

let uid;

auth.onAuthStateChanged(async user=>{
uid=user.uid;
const d=(await db.collection("users").doc(uid).get()).data();
pic.src=d.profilePic||"";
name.innerText=d.username;
job.innerText=d.occupation;
});

async function update(){
const nameVal=newName.value;
const jobVal=newJob.value;
const file=newPic.files[0];

let picUrl=null;

if(file){
const ref=storage.ref("profiles/"+uid);
await ref.put(file);
picUrl=await ref.getDownloadURL();
}

await db.collection("users").doc(uid).set({
username:nameVal,
occupation:jobVal,
profilePic:picUrl
},{merge:true});

alert("Updated");
location.reload();
}

</script>

</body>
</html>
