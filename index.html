<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Signup</title>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<style>
body{display:flex;justify-content:center;align-items:center;height:100vh;background:#0f172a;color:white;}
.box{background:#1e293b;padding:20px;border-radius:10px;width:300px;text-align:center;}
input{width:100%;padding:10px;margin-top:10px;}
button{margin-top:10px;padding:10px;width:100%;}
</style>
</head>

<body>

<div class="box">

<h2>Signup</h2>

<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">

<button onclick="signup()">Create Account</button>

</div>

<script>

const firebaseConfig={
apiKey:"AIzaSyD6c1k8BURliiSAwEOnT_HW1MaZjNhHJSM",
authDomain:"iron-companies.firebaseapp.com",
projectId:"iron-companies",
storageBucket:"iron-companies.firebasestorage.app",
messagingSenderId:"692492696732",
appId:"1:692492696732:web:cd29fc124ddc0fa014c159"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();

async function signup(){

const emailVal=email.value;
const passVal=pass.value;

const userCred=await auth.createUserWithEmailAndPassword(emailVal,passVal);

await userCred.user.sendEmailVerification();

alert("Verification email sent. Check inbox.");

auth.signOut();

}

</script>

</body>
</html>
